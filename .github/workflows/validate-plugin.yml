name: Validate Anthropic plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin against Anthropic specification
        run: npx -y @anthropic-ai/claude-code@2.1.286 plugin validate . --strict
